name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency or a PHP point release shows up on a Monday rather than inside someone's pull
  # request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.5 is the floor, as for the platform this client serves. Add newer versions as they ship.
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # No composer.lock (a library), so this resolves fresh every run.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: vendor/bin/phpunit --testdox

  static:
    name: PHPStan (level 8) and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpstan:2.2.13, php-cs-fixer:3.95.24

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: phpstan analyse --no-progress --memory-limit=1G

      # A dry run: the check reports the drift and fails; it never rewrites a file.
      - name: Code style
        run: php-cs-fixer fix --dry-run --diff

  # README, a LICENSE matching the manifest, and CHANGELOG (coolms/.github's basic-files.yml), pinned to a commit.
  basic-files:
    uses: coolms/.github/.github/workflows/basic-files.yml@595d36957a135e7d753abe34ca1ce90a0a6f2215
